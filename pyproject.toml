[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pod-invaders"
version = "1.0.0"
description = "A neon-styled space shooter game"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5",
]

[project.scripts]
pod-shooter = "pod_shooter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
