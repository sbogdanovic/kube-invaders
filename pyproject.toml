[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kube-invaders"
version = "1.0.0"
description = "A neon-styled space shooter game"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "ruff>=0.6.9",
]

[project.scripts]
kube-invaders = "kube_invaders.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
